# Databricks Asset Bundle of llmops-corretconseil, shaped like the course's llmops-course-code.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  engine: direct
  name: llmops-corretconseil
  # 1.20.0 is the first CLI that knows a model provider service's secret reference
  # (resources/gateway_demo.yml); an older one skips the gateway resources with a warning.
  # Minimum CLI tested with this bundle (engine: direct). Major 2 can break the bundle format.
  databricks_cli_version: ">= 1.22.1, < 2.0.0"

# The course package is built as a wheel and installed in every job environment.
artifacts:
  default:
    type: whl
    build: uv build
    path: .

variables:
  git_sha:
    description: git_sha
    default: abcd
  branch:
    description: branch
    default: main
  schedule_pause_status:
    description: schedule pause status
    default: PAUSED
  usage_policy_id:
    description: usage policy id for serverless jobs (usage_policy_id in project_config.yml)
    default: da4486a7-e7ae-3f75-842d-94f515c7aa51
  catalog:
    description: Unity Catalog catalog of the target (catalog in project_config.yml)

include:
  - resources/process_data.yml
  - resources/ai_search.yml
  - resources/synced_tables.yml
  - resources/volumes.yml

sync:
  include:
    - eval_inputs.txt
    - project_config.yml

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-88df4c2c-4033.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}
    variables:
      catalog: llmops_dev

  # Acceptance: deployed on every merge to main.
  acc:
    workspace:
      host: https://dbc-88df4c2c-4033.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}
    variables:
      catalog: llmops_acc
      schedule_pause_status: PAUSED

  # Production: deployed after acceptance, once you approve it.
  prd:
    workspace:
      host: https://dbc-88df4c2c-4033.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}
    variables:
      catalog: llmops_prd
      schedule_pause_status: PAUSED
