resources:
  jobs:
    data-pipeline:
      name: arxiv-data-pipeline
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "Europe/Amsterdam"
        pause_status: "${var.schedule_pause_status}"
      budget_policy_id: "${var.usage_policy_id}"
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl

      tasks:
        # DataProcessor.process_and_save() downloads the papers itself and owns the arxiv_papers
        # schema. The lecture 1.3 notebook writes the same table with another schema, so it is
        # not a task of this job.
        - task_key: pdf_parsing_ai_parse
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/2.2_pdf_parsing_ai_parse.py
            base_parameters:
              env: "${bundle.target}"
