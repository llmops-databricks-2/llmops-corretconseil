# Project configuration for the LLMOps course, filled in for you at onboarding.
# Resources are provisioned at onboarding except the volume, which you create during the course.

# Your usage policy: set it on every serverless job, endpoint and app you create.
usage_policy_id: "da4486a7-e7ae-3f75-842d-94f515c7aa51"

# Lakebase projects may be shared across environments; Unity Catalog
# schemas remain separate. Your cohort provisions the Lakebase values below.

# Development: your own schema in the dev catalog, which you manage and work in.
dev:
  catalog: "llmops_dev"
  schema: "corretconseil"
  volume: "arxiv_files"
  llm_endpoint: "course_ops.gateway.chat"
  # course_ops.gateway.embed can't be used: ai_query doesn't support custom Unity Gateway model
  # services yet (https://docs.databricks.com/aws/en/ai-gateway/query-model-services#limitations)
  # embedding_endpoint: course_ops.gateway.embed
  embedding_endpoint: databricks-gte-large-en
  warehouse_id: "99a0cb32b5273deb"
  experiment_path: "/llmops/corretconseil-dev"
  # Your provisioned Lakebase project.
  lakebase_project_id: lb-llmops-dev

# Acceptance: your schema in the acceptance catalog, written by your deploys; you read it.
acc:
  catalog: "llmops_acc"
  schema: "corretconseil"
  volume: "arxiv_files"
  llm_endpoint: "course_ops.gateway.chat"
  # course_ops.gateway.embed can't be used: ai_query doesn't support custom Unity Gateway model
  # services yet (https://docs.databricks.com/aws/en/ai-gateway/query-model-services#limitations)
  # embedding_endpoint: course_ops.gateway.embed
  embedding_endpoint: databricks-gte-large-en
  warehouse_id: "99a0cb32b5273deb"
  experiment_path: "/llmops/corretconseil-acc"
  # Your provisioned Lakebase project for this environment.
  lakebase_project_id: lb-llmops-acc

# Production: your schema in the production catalog, written by your deploys; you read it.
prd:
  catalog: "llmops_prd"
  schema: "corretconseil"
  volume: "arxiv_files"
  llm_endpoint: "course_ops.gateway.chat"
  # course_ops.gateway.embed can't be used: ai_query doesn't support custom Unity Gateway model
  # services yet (https://docs.databricks.com/aws/en/ai-gateway/query-model-services#limitations)
  # embedding_endpoint: course_ops.gateway.embed
  embedding_endpoint: databricks-gte-large-en
  warehouse_id: "99a0cb32b5273deb"
  experiment_path: "/llmops/corretconseil-prd"
  # Your provisioned Lakebase project for this environment.
  lakebase_project_id: lb-llmops-prd

# Model configuration
model_config:
  temperature: 0.7
  max_tokens: 2000
  top_p: 0.95

# Vector search configuration
vector_search:
  embedding_dimension: 1024
  similarity_metric: cosine
  num_results: 5

# Chunking configuration
chunking:
  chunk_size: 512
  chunk_overlap: 50
  separator: "\n\n"
